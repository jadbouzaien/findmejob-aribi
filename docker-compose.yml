services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-findmejob}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-findmejob}
    ports:
      - "127.0.0.1:5434:5432"   # accessible uniquement depuis la machine
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  # Profil "full" : pour le serveur maison -> docker compose --profile full up -d
  worker:
    profiles: ["full"]
    build: .
    command: npm run worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-findmejob}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-findmejob}
      TZ: Europe/Paris
    depends_on:
      db: { condition: service_healthy }

  web:
    profiles: ["full"]
    build: .
    command: sh -c "npm run build && npm start"
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-findmejob}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-findmejob}
      TZ: Europe/Paris
    ports:
      - "3101:3101"
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
